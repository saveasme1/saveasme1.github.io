<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" fill="none">
  <!-- Soft angled left arm (phone in right hand)  flesh silhouette + orange wrist ring -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9a888" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <!-- forearm from bottom-left, tilted ~28° -->
  <g transform="translate(40,420) rotate(-28)">
    <ellipse cx="90" cy="40" rx="52" ry="120" fill="url(#skin)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <!-- fist -->
    <ellipse cx="90" cy="-95" rx="48" ry="42" fill="url(#skin)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- knuckles hint -->
    <path d="M55,-115 Q70,-135 90,-138 Q110,-135 125,-115" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- orange guide ring at wrist -->
  <ellipse cx="168" cy="268" rx="46" ry="22" transform="rotate(-28 168 268)"
    stroke="#ff8236" stroke-width="5" fill="none" opacity="0.95" filter="url(#soft)"/>
  <circle cx="168" cy="268" r="5" fill="#ff8236"/>
  <text x="180" y="248" fill="#ffb089" font-size="15" font-family="system-ui,sans-serif" font-weight="700">+</text>
</svg>
