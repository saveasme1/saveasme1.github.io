<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d9a888" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Angled left hand dorsum, fingers up-left -->
  <g transform="translate(70,300) rotate(-22)">
    <ellipse cx="80" cy="70" rx="70" ry="55" fill="url(#skin)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- fingers -->
    <g stroke="rgba(255,255,255,0.45)" stroke-width="14" stroke-linecap="round" opacity="0.85">
      <path d="M40,30 L28,-70"/>
      <path d="M65,20 L60,-95"/>
      <path d="M95,22 L105,-85"/>
      <path d="M120,35 L140,-55"/>
    </g>
    <!-- thumb -->
    <path d="M30,55 L-10,10" stroke="rgba(255,255,255,0.4)" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- ring target on ring finger -->
  <ellipse cx="175" cy="155" rx="16" ry="11" transform="rotate(-18 175 155)"
    stroke="#ff8236" stroke-width="4" fill="none"/>
  <circle cx="175" cy="155" r="4" fill="#ff8236"/>
  <text x="192" y="145" fill="#ffb089" font-size="14" font-family="system-ui,sans-serif" font-weight="700">+</text>
</svg>
