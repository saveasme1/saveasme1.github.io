<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    (function () {
      var KEY = "hx.pwa.forceNuke.full3";
      try {
        if (sessionStorage.getItem(KEY) === "1") return;
      } catch (_) {}
      try { sessionStorage.setItem(KEY, "1"); } catch (_) {}
      var done = function () {
        var u = new URL(location.href);
        u.searchParams.set("_pwa", "20260806-full3");
        location.replace(u.href);
      };
      var tasks = [];
      try {
        if (window.caches) {
          tasks.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (_) {}
      try {
        if (navigator.serviceWorker) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
      } catch (_) {}
      Promise.all(tasks).then(done).catch(done);
    })();
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title></title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff;color:#111}
    p{font-size:clamp(1rem,3.2vw,1.25rem);line-height:1.6;text-align:center;word-break:keep-all}
  </style>
</head>
<body>
  <p>이 사이트는 폐쇄조치 되었습니다.</p>
</body>
</html>
