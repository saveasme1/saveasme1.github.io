<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    (function () {
      var KEY = "hx.pwa.forceNuke.20260810-gbcal55";
      try { if (localStorage.getItem(KEY) === "1") return; } catch (_) {}
      try { localStorage.setItem(KEY, "1"); } catch (_) {}
      var done = function () {
        var u = new URL(location.href);
        u.searchParams.set("_pwa", "20260806-hide1");
        location.replace(u.href);
      };
      var tasks = [];
      try {
        if (window.caches) {
          tasks.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (_) {}
      try {
        if (navigator.serviceWorker) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
      } catch (_) {}
      try {
        localStorage.removeItem("hx.pwa.updateSnooze");
      } catch (_) {}
      Promise.all(tasks).then(done).catch(done);
    })();
  </script>
