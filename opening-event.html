    (function () {

      if (link) link.href = kakao;

      var home = document.getElementById("evHome");
      if (home && /[?&]app=1(?:&|$)/.test(location.search)) {
        home.href = "./landing.html?app=1";
      }

      function tick() {
        var now = new Date();
        // 2026-08-08 24:00 KST == 2026-08-09 00:00 KST
        var end = new Date("2026-08-09T00:00:00+09:00");
        var sec = Math.max(0, Math.floor((end - now) / 1000));
        var h = String(Math.floor(sec / 3600)).padStart(2, "0");
        sec %= 3600;
        var m = String(Math.floor(sec / 60)).padStart(2, "0");
        var s = String(sec % 60).padStart(2, "0");
        var clock = document.getElementById("evClock");
        if (!clock) return;
        var spans = clock.querySelectorAll("span");
        if (spans[0]) spans[0].textContent = h;
        if (spans[1]) spans[1].textContent = m;
        if (spans[2]) spans[2].textContent = s;
      }
      tick();
      setInterval(tick, 1000);
    })();
