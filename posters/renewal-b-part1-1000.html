<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>본 헤리티지 · B1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>
html,body{margin:0;background:#111}
*{box-sizing:border-box}
:root{--accent:#ff8236}
body{font-family:Pretendard,SUIT,"Noto Sans KR",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.poster{width:1000px;height:1000px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:300px 1fr;background:#171719}
.visual{position:relative;overflow:hidden;background:#070708}
.visual .split{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr}
.visual img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.5) contrast(1.05) saturate(.85)}
.visual .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,7,.4) 0%,rgba(5,5,7,.15) 40%,rgba(5,5,7,.75) 100%)}
.brand{position:absolute;top:14px;left:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:#fff}
.brand img{width:36px;height:36px;border-radius:9px;display:block;filter:none!important}
.brand b{font-size:16px;font-weight:800;color:#161513}
.ghost{
  position:absolute;left:10px;top:46%;z-index:2;transform:translateY(-50%);
  font-family:Pretendard,sans-serif;font-weight:800;
  font-size:42px;line-height:.9;letter-spacing:.1em;
  color:rgba(255,255,255,.22);pointer-events:none;white-space:nowrap;
}
.mag{position:absolute;left:12px;right:10px;bottom:14px;z-index:4}
.mag .label{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.75)}
.mag .to{margin:0;font-size:28px;line-height:1.2;font-weight:900}
.mag .to i{font-style:normal;background:linear-gradient(180deg,transparent 58%,rgba(255,130,54,.8) 58%)}
.copy{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.meta{display:flex;justify-content:space-between;align-items:flex-start}
.meta .l{font-size:13px;font-weight:800;letter-spacing:.16em;color:#d0b58f}
.meta .r{text-align:right}
.meta .r b{display:block;font-size:12px;font-weight:800;color:#ffb07a;margin-bottom:2px}
.meta .r span{font-size:22px;font-weight:900}
h1{margin:0;font-size:36px;line-height:1.18;font-weight:900;letter-spacing:-.04em}
h1 i{font-style:normal;color:#ffb07a}
.alert{flex:1;margin:0;padding:20px 18px;border-radius:14px;background:rgba(255,130,54,.14);border:1px solid rgba(255,130,54,.4);font-size:22px;line-height:1.42;font-weight:800;word-break:keep-all;display:flex;align-items:center}
.hl{color:#ffb07a;font-weight:800}
.lead{margin:0;font-size:20px;line-height:1.4;font-weight:700;color:rgba(245,241,235,.92);word-break:keep-all}
</style>
</head>
<body>
<div class="poster">
  <aside class="visual">
    <div class="split">
      <img src="assets/camp-ella-1.jpg" alt="">
      <img src="assets/camp-yara-1.jpg" alt="">
    </div>
    <div class="grad"></div>
    <div class="brand"><img src="assets/app-icon.png" alt=""><b>본 헤리티지</b></div>
    <div class="ghost" aria-hidden="true">PRIVATE</div>
    <div class="mag">
      <p class="label">MEMBERS ONLY</p>
      <p class="to"><i>프라이빗</i></p>
    </div>
  </aside>
  <section class="copy">
    <div class="meta">
      <span class="l">PRIVATE</span>
      <div class="r"><b>리뉴얼 오픈 날짜</b><span>2026. 08. 01</span></div>
    </div>
    <h1>공개형에서<br><i>프라이빗 멤버십</i>으로</h1>
    <p class="alert">앞으로는 홈페이지를 누구나 자유롭게 이용하는 <span class="hl">공개형 운영이 아닌</span>, 대표 카카오톡을 통한 간단한 고객 인증 후 포트폴리오, 신제품, 공동구매 이벤트 등 다양한 정보를 안내해드리는 <span class="hl">프라이빗 멤버십</span> 운영 방식으로 변경됩니다.</p>
    <p class="lead">차별화된 경험과 브랜드 가치를 지키기 위한, 인증 고객 중심의 프라이빗 안내로 전환합니다.</p>
  </section>
</div>
</body>
</html>
