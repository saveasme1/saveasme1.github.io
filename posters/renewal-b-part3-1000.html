<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>본 헤리티지 · B3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>
html,body{margin:0;background:#111}
*{box-sizing:border-box}
:root{--accent:#ff8236;--ink:#161513;--paper:#f3efe9;--line:rgba(22,21,19,.12)}
body{font-family:Pretendard,SUIT,"Noto Sans KR",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.poster{width:1000px;height:1000px;margin:0 auto;overflow:hidden;display:grid;grid-template-rows:88px 1fr;background:var(--paper)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:38px;height:38px;border-radius:10px;display:block;filter:none!important}
.brand b{font-size:18px;font-weight:800}
.top .r{text-align:right}
.top .r b{display:block;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:2px}
.top .r span{font-size:22px;font-weight:900}
.main{padding:20px 24px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.14em;color:#9a8160;margin-bottom:6px}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
h1{margin:0;font-size:36px;line-height:1.12;font-weight:900;letter-spacing:-.04em}
.ghost{
  flex:0 0 auto;font-family:Pretendard,sans-serif;font-weight:800;
  font-size:56px;line-height:1;letter-spacing:.08em;
  color:rgba(22,21,19,.08);white-space:nowrap;
}
.lead{margin:0;font-size:20px;line-height:1.35;font-weight:700;color:#2c2925;word-break:keep-all}
.hl{color:var(--accent);font-weight:800}
.checks{margin:0;padding:0;list-style:none;flex:1;display:grid;grid-template-rows:repeat(6,1fr);gap:8px;min-height:0}
.checks li{display:flex;gap:12px;align-items:center;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:21px;line-height:1.25;font-weight:800;word-break:keep-all}
.checks i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1b130f;font-style:normal;font-size:13px;font-weight:900;display:grid;place-items:center}
.note{margin:0;font-size:16px;font-weight:800;color:#6a655e}
</style>
</head>
<body>
<div class="poster">
  <header class="top">
    <div class="brand"><img src="assets/app-icon.png" alt=""><b>본 헤리티지</b></div>
    <div class="r"><b>리뉴얼 오픈 날짜</b><span>2026. 08. 01</span></div>
  </header>
  <section class="main">
    <div class="head">
      <div>
        <div class="kicker"><i></i>THIS RENEWAL</div>
        <h1>이번 리뉴얼을 통해</h1>
      </div>
      <div class="ghost" aria-hidden="true">BENEFIT</div>
    </div>
    <p class="lead">아래 내용을 <span class="hl">순차적으로 선보일 예정</span>입니다.</p>
    <ul class="checks">
      <li><i>✓</i><span>더욱 전문적인 상담</span></li>
      <li><i>✓</i><span>검증된 고객 중심의 서비스</span></li>
      <li><i>✓</i><span>프리미엄 제품 라인 확대</span></li>
      <li><i>✓</i><span>한정 제작 및 공동구매 운영</span></li>
      <li><i>✓</i><span>골드바 · 실버바 · 다이아몬드 테니스 컬렉션 등 새로운 카테고리</span></li>
      <li><i>✓</i><span>좋은 금을 더 좋은 가격으로</span></li>
    </ul>
    <p class="note">위 내용은 순차적으로 선보일 예정입니다.</p>
  </section>
</div>
</body>
</html>
