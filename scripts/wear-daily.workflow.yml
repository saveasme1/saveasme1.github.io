# Copy to .github/workflows/wear-daily.yml after granting the push token `workflow` scope.
# Or run manually: node scripts/build-wear-daily.mjs && git commit/push hx-wear-daily.json
name: Build verified wear daily feed
on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build-wear-daily.mjs
      - run: |
          git config user.name "heritage-wear-bot"
          git config user.email "bot@hand-made.kr"
          git add hx-wear-daily.json hx-wear-candidates.json
          if git diff --staged --quiet; then echo "No feed changes"; else git commit -m "chore: refresh verified wear daily feed" && git push; fi
