<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    (function () {
      var KEY = "hx.pwa.forceNuke.gbcal30";
      try { if (localStorage.getItem(KEY) === "1") return; } catch (_) {}
      try { localStorage.setItem(KEY, "1"); } catch (_) {}
      var done = function () {
        var u = new URL(location.href);
        u.searchParams.set("_pwa", "20260806-hide1");
        location.replace(u.href);
      };
      var tasks = [];
      try {
        if (window.caches) {
          tasks.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (_) {}
      try {
        if (navigator.serviceWorker) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
      } catch (_) {}
      try {
        localStorage.removeItem("hx.pwa.updateSnooze");
      } catch (_) {}
      Promise.all(tasks).then(done).catch(done);
    })();
  </script>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="본 헤리티지">
  <title>본 헤리티지 · 사진으로 찾기</title>
  <script>
    (function () {
      try {
        var m = window.matchMedia;
        var p =
          (m &&
            (m("(display-mode: standalone)").matches ||
              m("(display-mode: fullscreen)").matches ||
              m("(display-mode: minimal-ui)").matches)) ||
          window.navigator.standalone === true ||
          /[?&]app=1(?:&|$)/.test(location.search);
        if (p) document.documentElement.classList.add("is-pwa");
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=20260809-gbcal30">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="search.css?v=20260728-pwa78">
  <link rel="stylesheet" href="pwa-app.css?v=20260728-pwa78">
</head>
<body>
  <header class="js-top">
    <a class="js-back" href="./landing.html">← 돌아가기</a>
    <strong>사진으로 찾기</strong>
    <span class="js-badge">BETA</span>
  </header>

  <main class="js-main">
    <section class="js-hero">
      <h1>주얼리 AI 검색</h1>
      <p>사진 업로드·카메라로 비슷한 작품을 찾습니다. 이 기능은 현재 베타 테스트 기능으로 정확하지 않을 수 있습니다.</p>
    </section>

    <section class="js-panel" aria-label="검색">
      <div class="js-tabs" role="tablist">
        <button type="button" class="is-active" data-tab="photo">사진</button>
        <button type="button" data-tab="camera">카메라</button>
      </div>

      <div class="js-tabpane is-active" id="pane-photo">
        <label class="js-drop" id="photoDrop">
          <input id="fileInput" type="file" accept="image/*" hidden>
          <strong>사진 선택 / 업로드</strong>
          <span>JPG·PNG · 최대 10MB</span>
        </label>
        <div class="js-preview" id="photoPreview" hidden></div>
        <div class="js-row">
          <button type="button" class="js-btn" id="photoClear" hidden>사진 지우기</button>
          <button type="button" class="js-btn primary" id="photoSearch" disabled>검색</button>
        </div>
      </div>

      <div class="js-tabpane" id="pane-camera">
        <video id="cameraVideo" playsinline muted></video>
        <div class="js-preview" id="cameraPreview" hidden></div>
        <div class="js-row">
          <button type="button" class="js-btn" id="cameraStart">카메라 켜기</button>
          <button type="button" class="js-btn" id="cameraCapture" disabled>촬영</button>
          <button type="button" class="js-btn primary" id="cameraSearch" disabled>촬영 후 검색</button>
        </div>
        <canvas id="cameraCanvas" hidden></canvas>
      </div>
    </section>

    <div class="js-loading" id="loading" hidden aria-live="polite">
      <div class="js-loading-track" aria-hidden="true"><i></i></div>
      <p id="loadingText">이미지 검색 중…</p>
    </div>

    <p class="js-status" id="status" aria-live="polite">준비됨</p>
    <section class="js-results" id="results" aria-label="검색 결과"></section>
    <section class="js-related" id="related" hidden aria-label="관련 상품">
      <h2>관련 상품</h2>
      <div class="js-grid" id="relatedGrid"></div>
    </section>
  </main>

  <script src="search.js?v=20260728-pwa78"></script>
  <script src="pwa-register.js?v=20260809-gbcal30"></script>
</body>
</html>
