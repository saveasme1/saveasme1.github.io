<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>본 헤리티지 · 출고확인</title>
  <meta name="theme-color" content="#161513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="본 헤리티지">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    (function () {
      try {
        var m = window.matchMedia;
        var p =
          (m &&
            (m("(display-mode: standalone)").matches ||
              m("(display-mode: fullscreen)").matches ||
              m("(display-mode: minimal-ui)").matches)) ||
          window.navigator.standalone === true ||
          /[?&]app=1(?:&|$)/.test(location.search);
        if (p) document.documentElement.classList.add("is-pwa");
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=20260728-pwa40">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="handmade-reviews.css?v=20260728-pwa40">
  <link rel="stylesheet" href="landing.css?v=20260728-pwa40">
  <link rel="stylesheet" href="portfolio-board.css?v=20260728-pwa40">
  <link rel="stylesheet" href="site-nav.css?v=20260728-pwa40">
  <link rel="stylesheet" href="pwa-app.css?v=20260728-pwa40">
</head>
<body class="pf-body board-standalone board-standalone--shipping">
  <main class="landing pf-shell board-standalone__main">
    <section class="board-inline-panel portfolio-inline shipping-inline is-standalone" id="shippingPanel" aria-label="실시간 출고확인">
      <div class="reviews-heading">
        <div>
          <h2>실시간 출고확인</h2>
          <p class="reviews-sub">본 헤리티지에서 제작 완료 후 출고한 주얼리 기록입니다.</p>
        </div>
        <button type="button" class="reviews-close" id="shippingClose">홈</button>
      </div>
      <div class="pf-deck pf-deck--inline">
        <aside class="pf-rail" aria-label="출고 컬렉션 필터">
          <div class="pf-rail-head">
            <div class="pf-rail-head-copy">
              <span class="pf-rail-kicker">Shipping</span>
              <strong class="pf-rail-count" id="shippingCount">—</strong>
            </div>
            <label class="pf-search">
              <span class="pf-search-ico" aria-hidden="true"></span>
              <input id="shippingSearch" type="search" placeholder="출고 게시글 검색" aria-label="출고 게시글 검색" enterkeyhint="search" autocomplete="off">
            </label>
            <div class="pf-tools-actions" hidden>
              <button type="button" class="primary pf-write" id="shippingWrite" hidden>글 작성하기</button>
              <span class="review-session" id="shippingSession"></span>
            </div>
          </div>
          <nav class="pf-cats" id="shipCats" role="tablist" aria-label="브랜드 카테고리"></nav>
          <div class="ship-date-strip" id="shipDateStrip" aria-label="날짜 빠른 선택"></div>
          <section class="ship-cal" id="shipCal" aria-label="출고 미니 캘린더"></section>
        </aside>
        <div class="pf-stage">
          <section class="pf-toolbar" aria-label="출고 도구"></section>
          <p class="pf-status" id="shippingStatus" aria-live="polite">불러오는 중…</p>
          <section class="pf-grid" id="shippingList" aria-label="출고 목록"></section>
          <nav class="reviews-pager pf-pager" id="shippingPager" aria-label="출고 페이지"></nav>
        </div>
      </div>
    </section>

    <section class="board-inline-panel" id="noticesPanel" hidden aria-hidden="true">
      <input id="noticesSearch" type="search" hidden>
      <p id="noticesStatus" hidden></p>
      <strong id="noticesCount" hidden>—</strong>
      <section id="noticesList" hidden></section>
      <button type="button" id="noticesWrite" hidden></button>
      <span id="noticesSession" hidden></span>
      <button type="button" id="noticesClose" hidden></button>
    </section>
  </main>

  <div class="board-dialog" id="boardDialog" role="dialog" aria-modal="true" aria-hidden="true">
    <article class="board-detail">
      <button class="board-close" id="boardClose" aria-label="닫기">×</button>
      <div class="board-detail-body">
        <div class="detail-images" id="detailImages"></div>
        <div class="detail-copy">
          <div class="detail-meta-row post-meta-row" id="detailMeta"></div>
          <h2 id="detailTitle"></h2>
          <div id="detailContent" class="html-content"></div>
          <div class="detail-actions" id="detailActions" hidden></div>
        </div>
      </div>
    </article>
  </div>

  <dialog class="review-dialog write-dialog" id="boardWriteDialog">
    <form id="boardWriteForm">
      <input type="hidden" name="boardType">
      <h2 id="boardWriteTitle">게시글 작성</h2>
      <label>제목<input name="title" minlength="2" maxlength="160" required placeholder="제목을 입력해 주세요"></label>
      <label>내용<textarea name="content" minlength="2" maxlength="20000" required placeholder="내용을 입력해 주세요"></textarea></label>
      <label>대표 이미지<input name="cover" type="file" accept="image/jpeg,image/png,image/webp" required></label>
      <label>추가 이미지 (최대 8장)<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <p class="review-image-help">대표 이미지는 필수이며 추가 이미지는 최대 8장입니다.</p>
      <p class="review-dialog-status" id="boardWriteStatus" aria-live="polite"></p>
      <div class="review-dialog-actions">
        <button type="button" id="boardWriteCancel">취소</button>
        <button class="primary" type="submit" id="boardWriteSubmit">등록하기</button>
      </div>
    </form>
  </dialog>

  <script src="time-kr.js?v=20260728-pwa40"></script>
  <script src="board-meta.js?v=20260728-pwa40"></script>
  <script src="html-editor.js?v=20260728-pwa40"></script>
  <script src="brand-codes.js?v=20260728-pwa40"></script>
  <script src="landing-boards.js?v=20260728-pwa40"></script>
  <script src="shipping-board.js?v=20260728-pwa40"></script>
  <script src="site-nav.js?v=20260728-pwa40"></script>
  <script src="pwa-register.js?v=20260728-pwa40"></script>
</body>
</html>
