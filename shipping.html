<body class="pf-body board-standalone board-standalone--shipping">
  <main class="landing pf-shell board-standalone__main">
    <section class="board-inline-panel portfolio-inline shipping-inline is-standalone" id="shippingPanel" aria-label="최종검수">
      <div class="reviews-heading">
        <div>
          <h2>최종검수</h2>
          <p class="reviews-sub">본 헤리티지에서 제작 완료 후 최종검수한 주얼리 기록입니다.</p>
        </div>
        <button type="button" class="reviews-close" id="shippingClose">홈</button>
      </div>
      <div class="pf-deck pf-deck--inline">
        <aside class="pf-rail" aria-label="최종검수 컬렉션 필터">
          <div class="pf-rail-head">
            <div class="pf-rail-head-copy">
              <span class="pf-rail-kicker">FINAL CHECK</span>
              <strong class="pf-rail-count" id="shippingCount">—</strong>
            </div>
            <label class="pf-search">
              <span class="pf-search-ico" aria-hidden="true"></span>
              <input id="shippingSearch" type="search" placeholder="최종검수 게시글 검색" aria-label="최종검수 게시글 검색" enterkeyhint="search" autocomplete="off">
            </label>
            <div class="pf-tools-actions" hidden>
              <button type="button" class="primary pf-write" id="shippingWrite" hidden>글 작성하기</button>
              <span class="review-session" id="shippingSession"></span>
            </div>
          </div>
          <nav class="pf-cats" id="shipCats" role="tablist" aria-label="브랜드 카테고리"></nav>
          <div class="ship-date-strip" id="shipDateStrip" aria-label="날짜 빠른 선택"></div>
          <section class="ship-cal" id="shipCal" aria-label="최종검수 미니 캘린더"></section>
        </aside>
        <div class="pf-stage">
          <section class="pf-toolbar" aria-label="최종검수 도구"></section>
          <p class="pf-status" id="shippingStatus" aria-live="polite">불러오는 중…</p>
          <section class="pf-grid" id="shippingList" aria-label="최종검수 목록"></section>
          <nav class="reviews-pager pf-pager" id="shippingPager" aria-label="최종검수 페이지"></nav>
        </div>
      </div>
    </section>

    <section class="board-inline-panel" id="noticesPanel" hidden aria-hidden="true">
      <input id="noticesSearch" type="search" hidden>
      <p id="noticesStatus" hidden></p>
      <strong id="noticesCount" hidden>—</strong>
      <section id="noticesList" hidden></section>
      <button type="button" id="noticesWrite" hidden></button>
      <span id="noticesSession" hidden></span>
      <button type="button" id="noticesClose" hidden></button>
    </section>
  </main>

  <div class="board-dialog" id="boardDialog" role="dialog" aria-modal="true" aria-hidden="true">
    <article class="board-detail">
      <button class="board-close" id="boardClose" aria-label="닫기">×</button>
      <div class="board-detail-body">
        <div class="detail-images" id="detailImages"></div>
        <div class="detail-copy">
          <div class="detail-meta-row post-meta-row" id="detailMeta"></div>
          <h2 id="detailTitle"></h2>
          <div id="detailContent" class="html-content"></div>
          <div class="detail-actions" id="detailActions" hidden></div>
        </div>
      </div>
    </article>
  </div>

  <dialog class="review-dialog write-dialog gb-write-dialog" id="boardWriteDialog">
    <form id="boardWriteForm">
      <input type="hidden" name="boardType">
      <h2 id="boardWriteTitle">게시글 작성</h2>
      <div class="pf-writer-fields">
        <div class="pf-writer-shipping-meta" id="boardShippingMeta" hidden>
          <div class="pf-writer-cat">
            <span class="pf-writer-label">카테고리</span>
            <input type="hidden" name="category" value="ETC">
            <div class="pf-writer-cats" id="boardShipCatChips" role="listbox" aria-label="카테고리 선택"></div>
          </div>
          <label class="pf-writer-date">게시일<input name="publishedAt" type="datetime-local"></label>
        </div>
        <label class="pf-writer-title">제목<input name="title" minlength="2" maxlength="160" required placeholder="제목을 입력해 주세요"></label>
        <label class="pf-writer-content">내용<textarea name="content" minlength="2" maxlength="20000" required placeholder="내용을 입력해 주세요"></textarea></label>
      </div>
      <section class="pf-writer-images" aria-label="이미지">
        <div class="pf-writer-block pf-writer-cover-block">
          <div class="pf-writer-heading">
            <strong>대표 이미지</strong>
            <span>목록에 가장 먼저 보이는 이미지</span>
          </div>
          <div class="pf-writer-cover-row">
            <div class="pf-writer-cover is-empty" id="boardCoverPreview">대표 이미지 없음</div>
            <label class="pf-writer-file">대표 사진 선택<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
          </div>
        </div>
        <div class="pf-writer-block pf-writer-detail-block">
          <div class="pf-writer-heading">
            <strong>추가 이미지</strong>
            <span>클릭하여 사진 추가</span>
          </div>
          <label class="pf-writer-file compact">클릭하여 사진 추가<input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
          <div class="pf-writer-grid" id="boardDetailGrid"></div>
        </div>
      </section>
      <div class="pf-writer-footer">
        <p class="review-image-help" id="boardWriteHelp">대표 이미지를 올려 주세요.</p>
        <p class="review-dialog-status" id="boardWriteStatus" aria-live="polite"></p>
        <div class="review-dialog-actions">
          <button type="button" id="boardWriteCancel">취소</button>
          <button class="primary" type="submit" id="boardWriteSubmit">등록하기</button>
        </div>
      </div>
    </form>
  </dialog>
